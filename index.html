<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="메시지">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon.png">
<title>메시지</title>
<style>
  :root{
    --bg:#000; --bubble-in:#262629;
    --text:#fff; --sub:#8E8E93; --link:#0A84FF; --glass:rgba(60,60,67,.55);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);height:100%;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none}
  .phone{max-width:430px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}

  /* 헤더: 노치/다이내믹 아일랜드 아래로 */
  .header{position:sticky;top:0;z-index:4;display:flex;flex-direction:column;align-items:center;
    padding:calc(var(--safe-top) + 6px) 16px 12px;
    background:linear-gradient(#000 78%,rgba(0,0,0,0))}
  .back{position:absolute;left:14px;top:calc(var(--safe-top) + 12px);width:42px;height:42px;border-radius:50%;
    background:var(--glass);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    border:none;display:grid;place-items:center}
  .back svg{width:20px;height:20px}
  .avatar{width:60px;height:60px;border-radius:50%;background:linear-gradient(160deg,#A8A8AE,#6E6E73);
    display:grid;place-items:center;font-size:26px;font-weight:600;color:#fff}
  .name{margin-top:-8px;padding:6px 14px;border-radius:999px;background:var(--glass);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);
    font-size:15px;font-weight:600;display:flex;align-items:center;gap:4px}
  .name span{color:var(--sub);font-weight:400}

  /* 대화 (수신만) */
  .chat{flex:1;padding:8px 12px calc(var(--safe-bottom) + 90px);display:flex;flex-direction:column;gap:6px}
  .stamp{text-align:center;color:var(--sub);font-size:12px;line-height:1.4;margin:18px 0 8px}
  .stamp b{font-weight:600}
  .msg{align-self:flex-start;max-width:72%;padding:9px 14px;border-radius:20px;font-size:16px;line-height:1.35;
    position:relative;white-space:pre-line;word-break:keep-all;background:var(--bubble-in)}
  .msg.tail::before{content:"";position:absolute;left:-6px;bottom:0;width:16px;height:18px;
    background:var(--bubble-in);border-bottom-right-radius:14px}
  .msg.tail::after{content:"";position:absolute;left:-10px;bottom:0;width:10px;height:18px;
    background:var(--bg);border-bottom-right-radius:10px}
  .msg a{color:var(--link)}
  .gap{height:8px}

  /* 입력창: 홈 인디케이터 위로 */
  .composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;
    display:flex;gap:10px;align-items:center;
    padding:10px 14px calc(var(--safe-bottom) + 10px);
    background:linear-gradient(rgba(0,0,0,0),#000 35%)}
  .plus{flex:none;width:42px;height:42px;border-radius:50%;background:var(--glass);
    -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border:none;display:grid;place-items:center}
  .plus svg{width:20px;height:20px}
  .field{flex:1;height:42px;border-radius:21px;border:1px solid #3A3A3C;background:rgba(28,28,30,.8);
    display:flex;align-items:center;padding:0 14px;gap:8px}
  .field input{flex:1;min-width:0;background:none;border:none;outline:none;color:#fff;font-size:16px;font-family:inherit}
  .field input::placeholder{color:#5A5A5F}
  .field svg{width:18px;height:18px;flex:none}
</style>
</head>
<body>
<div class="phone">
  <div class="header">
    <button class="back" aria-label="뒤로">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4l-8 8 8 8"/></svg>
    </button>
    <div class="avatar">지</div>
    <div class="name">지민 <span>›</span></div>
  </div>

  <div class="chat">
    <div class="stamp"><b>문자 메시지 • RCS</b><br>(어제) 23:55</div>
    <div class="msg">퇴근했어?</div>
    <div class="msg tail">이번 주말에 시간 되면 성수 가자
그 전시 이번 주까지래</div>

    <div class="stamp">(어제) 23:58</div>
    <div class="msg tail">토요일 2시 성수역 3번 출구 어때
예매 링크 <a href="#">exhibition.example</a></div>

    <div class="stamp">오늘 08:42</div>
    <div class="msg">일어났어?</div>
    <div class="msg tail">답장 줘~ 예매 마감 전에 해야 돼</div>
  </div>

  <div class="composer">
    <button class="plus" aria-label="추가">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 4v16M4 12h16"/></svg>
    </button>
    <label class="field">
      <input placeholder="문자 메시지 • RCS">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8E8E93" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </label>
  </div>
</div>
</body>
</html>
